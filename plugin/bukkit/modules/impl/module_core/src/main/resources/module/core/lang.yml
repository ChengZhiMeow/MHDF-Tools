config_version: "${project.version}"

command_info_format: "  &f{usage}  \n &8 - &7{description}"

commands:
  mhdftools:
    usage: "/{command} <参数>"
    description: "主命令"
    sub_commands:
      feature:
        usage: "/{command} feature"
        description: "功能帮助"
        message: |-
          &f
          &7⌜       <#FF359F>MHDF-Tools &f{version} - <#CFC2FF>梦之工具 &7      ⌝
          &f
          {help_list}
          &f
          &7⌞     <click:run_command:"/{command} feature {last_page}"><hover:show_text:"<#EAE4FF>点击返回上一页">&f[上一页]</hover></click>     <{page}/{max_page}>     <click:run_command:"/{command} feature {next_page}"><hover:show_text:"<#EAE4FF>点击返回下一页">&f[下一页]</hover></click>&7     ⌟
          &f
      help:
        usage: "/{command} help"
        description: "命令帮助"
        message: |-
          &f
          &7⌜       <#FF359F>MHDF-Tools &f{version} - <#CFC2FF>梦之工具 &7      ⌝
          &f
          {help_list}
          &f
          &7⌞                                         ⌟
      import:
        usage: "/{command} import <插件名称>"
        description: "导入其他插件的数据"
        plugin_not_support: "{prefix} <#FFB8B8>目标插件不支持导入!"
        import:
          start: "{prefix} <#EAE4FF>开始导入 &f{plugin} <#EAE4FF>的 &b{name} <#EAE4FF>数据!"
          done: "{prefix} <#EAE4FF>导入 &f{plugin} <#EAE4FF>的 &e{name} <#EAE4FF>数据完成!&7(耗时: {time}ms)"
        message:
          start: "{prefix} <#EAE4FF>开始导入 &f{plugin} <#EAE4FF>的数据!"
          done: "{prefix} <#EAE4FF>导入 &f{plugin} <#EAE4FF>的数据完成!"
      reload:
        usage: "/{command} reload"
        description: "重载插件"
        message: "{prefix} <#EAE4FF>插件重载完成!"
