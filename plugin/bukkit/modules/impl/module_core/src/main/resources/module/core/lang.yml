config_version: "${project.version}"

command_info_format: "  &f{usage}  \n &8 - &7{description}"

commands:
  mhdftools:
    usage: "/{command} <参数>"
    description: "主命令"
    sub_commands:
      feature:
        usage: "/{command} feature"
        description: "功能帮助"
        message: |-
          &f
          &7⌜       <#FF359F>MHDF-Tools &f{version} - <#CFC2FF>梦之工具 &7      ⌝
          &f
          {help_list}
          &f
          &7⌞     <click:run_command:"/{command} feature {last_page}"><hover:show_text:"<#EAE4FF>点击返回上一页">&f[上一页]</hover></click>     <{page}/{max_page}>     <click:run_command:"/{command} feature {next_page}"><hover:show_text:"<#EAE4FF>点击返回下一页">&f[下一页]</hover></click>&7     ⌟
          &f
      help:
        usage: "/{command} help"
        description: "命令帮助"
        message: |-
          &f
          &7⌜       <#FF359F>MHDF-Tools &f{version} - <#CFC2FF>梦之工具 &7      ⌝
          &f
          {help_list}
          &f
          &7⌞                                         ⌟
      reload:
        usage: "/{command} reload"
        description: "重载插件"
        message: "{prefix} <#EAE4FF>插件重载完成!"
