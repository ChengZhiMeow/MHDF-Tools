# 配置文件版本号(请勿修改)
config_version: "${project.version}"

# 时间操作
#
# 开关
enable: true
# 操作列表
list:
  # 自定义命名
  # !mhdf_tools_update_ignore!
  message:
    # 类型
    # =========================================
    # 定时操作 ——每多久操作一次
    # 定点操作 ——指定时间操作一次
    # =========================================
    type: "定时操作"
    # 时间(时:分:秒)
    time: "0:0:60"
    # 操作
    actions:
      - actions:
          - # 类型(开头带*为必填参数, []内为默认值)
            # prev_page           上一页
            # next_page           下一页
            # connect_server      跨服(*server)
            # player_command      玩家身份执行命令(*command, op[false], chat[false])
            # console_command     后台身份执行命令(*command)
            # title               发送标题消息(title[""], subtitle[""], in[20], step[70], out[10])
            # message             发送消息(*message)
            # broadcast           发送全体消息(*message)
            # action_bar          发送操作栏消息(*message)
            # boss_bar            发送BOSS血条(*title, color[YELLOW], style[PROGRESS], current[100], *delay[100])
            # play_sound          发送音效(*sound, volume[1.0], pitch[1.0])
            # chat                以玩家身份发送消息(*message)
            type: "broadcast"
            message: "&e感谢使用梦之工具~"
  # 自定义命名
  # !mhdf_tools_update_ignore!
  lunch:
    # 类型
    # =========================================
    # 定时操作 ——每多久操作一次
    # 定点操作 ——指定时间操作一次
    # =========================================
    type: "定点操作"
    # 时间(时:分:秒)
    time: "12:0:0"
    # 操作
    actions:
      - actions:
          - # 类型(开头带*为必填参数, []内为默认值)
            # prev_page           上一页
            # next_page           下一页
            # connect_server      跨服(*server)
            # player_command      玩家身份执行命令(*command, op[false], chat[false])
            # console_command     后台身份执行命令(*command)
            # title               发送标题消息(title[""], subtitle[""], in[20], step[70], out[10])
            # message             发送消息(*message)
            # broadcast           发送全体消息(*message)
            # action_bar          发送操作栏消息(*message)
            # boss_bar            发送BOSS血条(*title, color[YELLOW], style[PROGRESS], current[100], *delay[100])
            # play_sound          发送音效(*sound, volume[1.0], pitch[1.0])
            # chat                以玩家身份发送消息(*message)
            type: "broadcast"
            message: "&e到点了该吃饭了"
