# 配置文件版本号(请勿修改)
config_version: "${project.version}"

# 聊天
enable: true

# 聊天延迟
# 绕过权限: mhdftools.bypass.chat.delay
delay:
  # 开关
  enable: true
  # 延迟
  delay: 3

# 禁止刷屏
# 绕过权限: mhdftools.bypass.chat.spam
spam:
  # 开关
  enable: true

# 替换词
# 绕过权限: mhdftools.bypass.chat.replaceWord
replace_word:
  # 开关
  enable: true
  # 替换
  replace:
    - # 文本
      word:
        - '((https|http)?://)[^\s]+'
      # 替换方式
      # word  ——替换目标词
      # line  ——替换整句
      type: "word"
      # 使用正则匹配
      regex: true
      # 绕过
      bypass:
        # 开关
        enable: false
        # 权限
        permission: ""
      # 替换后的文本
      replace_word: "<click:open_url:'{value}'><hover:show_text:'&f网址: <#EAE4FF>{value}<br><br><#EAE4FF>点击打开该网站'>&7[<#EAE4FF>网站&7]</hover></click>"
    - # 文本
      word:
        - "傻逼"
      # 替换方式
      # word  ——替换目标词
      # line  ——替换整句
      type: "line"
      # 使用正则匹配
      regex: false
      # 绕过
      bypass:
        # 开关
        enable: true
        # 权限
        permission: "mhdftools.bypass.chat.blackword"
      # 替换后的句子(随机选择)
      line_list:
        - "你好帅"

# 展示物品
show_item:
  # 开关
  enable: true
  # 格式
  format: "<click:run_command:'/lookitem {uuid}'>&7[&f{name} <#EAE4FF>x{amount}&7]"
  # 关键词
  word:
    - "[i]"
  # 移除缓存时间(单位: 秒)
  remove_cache: 60
  # 命令
  commands:
    - "lookitem"

# 展示背包
show_inventory:
  # 开关
  enable: true
  # 格式
  format: "<click:run_command:'/lookinventory {uuid}'>&7[&f{player} <#EAE4FF>的背包&7]"
  # 关键词
  word:
    - "[inv]"
  # 移除缓存时间(单位: 秒)
  remove_cache: 60
  # 命令
  commands:
    - "lookinventory"

# 展示末影箱
show_ender_chest:
  # 开关
  enable: true
  # 格式
  format: "<click:run_command:'/lookenderchest {uuid}'>&7[&f{player} <#EAE4FF>的末影箱&7]"
  # 关键词
  word:
    - "[ec]"
  # 移除缓存时间(单位: 秒)
  remove_cache: 60
  # 命令
  commands:
    - "lookenderchest"

# 私聊
msg:
  # 开关
  enable: true
  # 命令
  commands:
    - "w"
    - "msg"
    - "tell"
  # 回复
  reply_commands:
    - "r"
    - "reply"

# at
at:
  # 开关
  enable: true
  # 匹配正则 @{
  pattern_format: "@?{at}"
  # 全体消息的关键词
  # 全体消息权限: mhdftools.chat.all
  all_message:
    - "all"

# 格式
# 聊天颜色权限: mhdftools.chat.color
# 聊天miniMessage格式权限: mhdftools.chat.minimessage
format:
  # 开关
  enable: true
  # 默认
  default:
    # 权重
    weight: 0
    # 格式
    format: "&f[玩家] {player}&f: {message}"
  # 拥有 mhdftools.group.chatformat.<名字> 权限的提示
  # 例如 mhdftools.group.chatformat.admin
  # !noUpdate
  admin:
    # 权重
    weight: 1
    # 格式
    format: "&c[管理] {player}&f: {message}"
