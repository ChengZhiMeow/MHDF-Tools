# 配置文件版本号(请勿修改)
config_version: "${project.version}"

# 标题
title: "<#EAE4FF>传送到这里"

# 格子
slots:
  - "TTTTTTTTT"
  - "TTTTTTTTT"
  - "TTTTTTTTT"
  - "TTTTTTTTT"
  - "TTTTTTTTT"
  - "PXXXXXXXN"

# 格子字符
keys:
  player: "T"

# 物品
items:
  player:
    by: "Vanilla"
    type: "player_head"
    name: "<#EAE4FF>{target}"
    lore:
      - ""
      - "&e点击发送传送请求"
  X: &X_ITEM
    by: "Vanilla"
    type: "gray_stained_glass_pane"
    name: "&f "
  P_1: *X_ITEM
  P_2:
    by: "Vanilla"
    type: "red_stained_glass_pane"
    name: "<#EAE4FF>上一页"
    conditions:
      - type: ">"
        disabled_check: true
        value1: "{page}"
        value2: 1
    actions:
      all:
        - actions:
            - type: "prev_page"
  N_1: *X_ITEM
  N_2:
    by: "Vanilla"
    type: "lime_stained_glass_pane"
    name: "<#EAE4FF>下一页"
    conditions:
      - type: ">"
        disabled_check: true
        value1: "{max_page}"
        value2: "{page}"
    actions:
      all:
        - actions:
            - type: "next_page"
