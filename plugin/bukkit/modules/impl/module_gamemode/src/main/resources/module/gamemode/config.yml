# 配置文件版本号(请勿修改)
config_version: "${project.version}"

# 切换游戏模式
#
# 开关
enable: true
# 游戏模式
gamemode:
  # 生存
  survival:
    - "survival"
    - "生存"
    - "0"
  # 创造
  creative:
    - "creative"
    - "创造"
    - "1"
  # 冒险
  adventure:
    - "adventure"
    - "冒险"
    - "2"
  # 旁观
  spectator:
    - "spectator"
    - "旁观"
    - "3"
# tab补全
tabCompleter:
  - "生存"
  - "创造"
  - "冒险"
  - "旁观"
# 命令
commands:
  - "gamemode"
  - "gm"
