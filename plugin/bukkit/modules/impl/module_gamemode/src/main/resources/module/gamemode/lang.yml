# 配置文件版本号(请勿修改)
config_version: "${project.version}"

gamemode:
  SURVIVAL: "生存模式"
  ADVENTURE: "冒险模式"
  CREATIVE: "创造模式"
  SPECTATOR: "旁观模式"

commands:
  gamemode:
    usage: "/{command} <游戏模式> [玩家]"
    description: "修改玩家游戏模式"
    noGameMode: "{prefix} <#FFB8B8>找不到名为 &f{gamemode} <#FFB8B8>的游戏模式!"
    message: "{prefix} &f{player} <#EAE4FF>的游戏模式已被更新为 &b{gamemode}<#EAE4FF>!"
