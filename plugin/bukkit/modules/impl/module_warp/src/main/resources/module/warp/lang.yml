# 配置文件版本号(请勿修改)
config_version: "${project.version}"

commands:
  warp:
    usage: "/{command} <传送点> [玩家]"
    description: "传送到指定传送点"
    no_warp: "{prefix} <#FFB8B8>传送点 &f{warp} <#FFB8B8>不存在!"
    message: "{prefix} <#EAE4FF>你传送到了传送点 &f{warp}<#EAE4FF>!"
  setwarp:
    usage: "/{command} <传送点>"
    description: "设置传送点"
    message: "{prefix} <#EAE4FF>传送点 &f{warp} <#EAE4FF>已设置!"
  delwarp:
    usage: "/{command} <传送点>"
    description: "删除传送点"
    no_warp: "{prefix} <#FFB8B8>传送点 &f{warp} <#FFB8B8>不存在!"
    message: "{prefix} <#EAE4FF>传送点 &f{warp} <#EAE4FF>已删除!"
