# 配置文件版本号(请勿修改)
config_version: "${project.version}"

# 家
#
# 开关
enable: true

# 存在则替换家
exist_replace: true

# 默认最大家数量
# 可以通过 mhdftools.commands.home.max.<数量> 自定义
default_max: 10

# 正则匹配名称
regex: '^[a-zA-Z0-9一-龥_-]+\$'

# 家命令
home_commands:
  - "home"

# 设置家命令
sethome_commands:
  - "sethome"

# 删除家命令
delhome_commands:
  - "delhome"

# 黑名单世界
black_world:
  - "pvp"
