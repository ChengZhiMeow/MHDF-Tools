# 配置文件版本号(请勿修改)
config_version: "${project.version}"

commands:
  home:
    usage: "/{command} [家]"
    description: "返回到指定家"
    no_home: "{prefix} <#FFB8B8>家 &f{home} <#FFB8B8>不存在!"
    open_menu_message: "{prefix} <#EAE4FF>你打开了家列表!"
    invalid_name: "{prefix} <#FFB8B8>无效的名称!"
    message: "{prefix} <#EAE4FF>你传送到了家 &f{home}<#EAE4FF>!"
  sethome:
    usage: "/{command} <家>"
    description: "设置家"
    have_home: "{prefix} <#FFB8B8>家 &f{home} <#FFB8B8>已存在!"
    is_max: "{prefix} <#FFB8B8>你已经设置了 &f{amount} <#FFB8B8>个家, 无法设置更多家!"
    message: "{prefix} <#EAE4FF>家 &f{home} <#EAE4FF>已设置!"
  delhome:
    usage: "/{command} <家>"
    description: "删除家"
    no_home: "{prefix} <#FFB8B8>家 &f{home} <#FFB8B8>不存在!"
    message: "{prefix} <#EAE4FF>家 &f{home} <#EAE4FF>已删除!"
