# 配置文件版本号(请勿修改)
config_version: "${project.version}"

commands:
  ip:
    usage: "/{command} <玩家>"
    description: "查询一个玩家的IP信息"
    message: |-
      &f
      &7⌜       <#FF359F>MHDF-Tools &f{version} - <#CFC2FF>梦之工具 &7      ⌝
      &f
      &8▪ &f玩家: <#CFC2FF>{player}
      &8▪ &7IP: &f{ip}
      &8▪ &7归属地: &f{location}
      &f
      &7⌞                                         ⌟