# 配置文件版本号(请勿修改)
config_version: "${project.version}"

# 标题
title: "<#EAE4FF>位置记录列表"

# 格子
slots:
  - "LLLLLLLLL"
  - "LLLLLLLLL"
  - "LLLLLLLLL"
  - "LLLLLLLLL"
  - "LLLLLLLLL"
  - "PXXXXXXXN"

# 格子字符
keys:
  location: "L"
  previous_page: "P"
  next_page: "N"

# 物品
items:
  location:
    by: "Vanilla"
    type: "red_bed"
    name: "<#EAE4FF>{year}/{month}/{day} {hour}:{minute}:{second}"
    lore:
      - "&8▪ &7类型: &f{type}"
      - "&8▪ &7服务器: &f{server}"
      - "&8▪ &7世界: &f{world}"
      - "&8▪ &7X: &f{x}"
      - "&8▪ &7Y: &f{y}"
      - "&8▪ &7Z: &f{z}"
      - "&8▪ &7Yaw: &f{yaw}"
      - "&8▪ &7Pitch: &f{pitch}"
      - ""
      - "&e点击传送"
  X:
    by: "Vanilla"
    type: "gray_stained_glass_pane"
    name: "&f "
  previous_page:
    by: "Vanilla"
    type: "red_stained_glass_pane"
    name: "<#EAE4FF>上一页"
  next_page:
    by: "Vanilla"
    type: "lime_stained_glass_pane"
    name: "<#EAE4FF>下一页"
