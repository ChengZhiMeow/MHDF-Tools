# 配置文件版本号(请勿修改)
config_version: "${project.version}"

# 返回上次位置
#
# 开关
enable: true

# 默认最大保存数量
# 可以通过 mhdftools.commands.back.max.<数量> 自定义
default_max: 5

# 保存类型
save:
  # 传送
  teleport: true
  # 死亡
  death: true

# 重生提示
respawn_message: true

# 命令
commands:
  - "back"

# 黑名单世界
black_world:
  - "pvp"
