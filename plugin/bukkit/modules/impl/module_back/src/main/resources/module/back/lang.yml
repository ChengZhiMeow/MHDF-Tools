# 配置文件版本号(请勿修改)
config_version: "${project.version}"

commands:
  back:
    usage: "/{command} [menu|teleport|death]"
    description: "返回位置记录"
    no_location: "{prefix} <#EAE4FF>找不到你上次的位置记录!"
    respawn_message: "{prefix} <#EAE4FF>输入 &f/back <#EAE4FF>返回死亡点!"
    open_menu_message: "{prefix} <#EAE4FF>你打开了位置记录列表!"
    message: "{prefix} <#EAE4FF>你来到了该位置记录, 输入 &f/back <#EAE4FF>返回传送前的位置!"
    types:
      teleport: "传送前的位置"
      death: "死亡位置"
