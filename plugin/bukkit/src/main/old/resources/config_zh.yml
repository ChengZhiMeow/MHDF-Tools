#########################################操作列表#########################################
# [connect]|<服务器>                                     ——切换服务器
# [player]|<命令>                                       ——玩家执行命令
# [player_op]|<命令>                                    ——玩家以op权限执行命令(注意保护)
# [console]|<命令>                                      ——后台执行命令
# [broadcast]|<消息>                                    ——发送全服消息
# [message]|<消息>                                      ——发送消息给玩家
# [actionbar]|<消息>                                    ——发送操作栏消息
# [bossbar]|<消息>|<颜色>|<样式>|<进度>|<显示时间>          ——给玩家发送一个限时boss血条
# [title]|<主标题>|<副标题>|<淡入时间>|<停留时间>|<淡出时间>  ——给玩家发送一个标题消息
# [chat]|<消息>                                         ——以玩家身份发送消息
# [sound_bukkit]|<音效ID>|<音量>|<音调>                   ——给玩家发送一个bukkit音效ID的音效
# [sound_minecraft]|<音效ID>|<音量>|<音调>                ——给玩家发送一个minecraft音效ID的音效
# [menu]|<菜单>                                         ——打开自定义菜单
# [close]                                              ——关闭菜单
#########################################操作列表#########################################
# 任意操作后面增加 <delay=[Tick]> 可以延迟操作
# 例如: [player]|say BaiShenYaoDog<delay=5>
#########################################操作列表#########################################
#
#########################################PAPI变量#########################################
# %mhdftools_nick_name%               ——匿名名称(如果没有,则返回默认ID)
# %mhdftools_money_amount%            ——经济数量
# %mhdftools_money_name%              ——货币名称
#########################################PAPI变量#########################################

# 配置文件版本号(请勿修改)
config_version: "${project.version}"

# 调试模式
debug: false

# bStats https://bstats.org/plugin/bukkit/MHDF-Tools/24887
bStats: true

# 更新检测
updateCheck: false

# 飞行
flySettings:
  # 开关
  enable: true
  # 自动开启
  autoEnable:
    # 加入服务器
    joinServer: true
    # 切换世界
    changeWorld: true
    # 重生
    respawn: true
  # 自动关闭
  autoDisable:
    # 掉血
    takeHealth: false
    # 世界列表
    worldList:
      - "awa"
  # 飞行强制关闭坠落倒计时
  fallTime: 5
  # 命令
  commands:
    - "fly"
  # 限时飞行命令
  flytimeCommands:
    - "flytime"

# 传送到玩家
tpaSettings:
  # 开关
  enable: true
  # 延迟
  delay: 60
  # 命令
  commands:
    - "tpa"
  # 黑名单世界
  blackWorld:
    - "pvp"

# 传送玩家过来
tpahereSettings:
  # 开关
  enable: true
  # 延迟
  delay: 60
  # 命令
  commands:
    - "tpahere"
  # 黑名单世界
  blackWorld:
    - "pvp"

# 自定义菜单
customMenuSettings:
  # 开关
  enable: true
  # 命令
  commands:
    - "menu"

# 家系统
homeSettings:
  # 开关
  enable: true
  # 存在则替换家
  existReplace: true
  # 默认最大家数量
  # 可以通过 mhdftools.commands.home.max.<数量> 自定义
  defaultMax: 10
  # 正则匹配名称
  regex: '^[a-zA-Z0-9\u4e00-\u9fa5_-]+\$'
  # 命令
  commands:
    - "home"
  # 家命令
  sethomeCommands:
    - "sethome"
  # 删除家命令
  delhomeCommands:
    - "delhome"
  # 黑名单世界
  blackWorld:
    - "pvp"

# 返回上次位置
backSettings:
  # 开关
  enable: true
  # 默认最大保存数量
  # 可以通过 mhdftools.commands.back.max.<数量> 自定义
  defaultMax: 5
  # 保存类型
  save:
    # 传送
    teleport: true
    # 死亡
    death: true
  # 重生提示
  respawnMessage: true
  # 命令
  commands:
    - "back"
  # 黑名单世界
  blackWorld:
    - "pvp"

# 出生点
spawnSettings:
  # 开关
  enable: true
  # 自动传送
  autoTeleport:
    # 复活
    respawn: false
    # 加入服务器
    join: false
  # 位置
  location:
    # 服务器
    server: "无"
    # 世界
    world: "world"
    # x轴坐标
    x: 0.0
    # y轴坐标
    y: 60.0
    # z轴坐标
    z: 0.0
    # yaw角度
    yaw: 0.0
    # pitch角度
    pitch: 0.0
  # 命令
  commands:
    - "spawn"
  setspawnCommands:
    - "setspawn"
  # 黑名单世界
  blackWorld:
    - "pvp"

# 匿名
nickSettings:
  # 开关
  enable: true
  # 命令
  commands:
    - "nick"

# 切换游戏模式
gamemodeSettings:
  # 开关
  enable: true
  # 游戏模式
  gamemode:
    # 生存
    survival:
      - "survival"
      - "生存"
      - "0"
    # 创造
    creative:
      - "creative"
      - "创造"
      - "1"
    # 冒险
    adventure:
      - "adventure"
      - "冒险"
      - "2"
    # 旁观
    spectator:
      - "spectator"
      - "旁观"
      - "3"
  # tab补全
  tabCompleter:
    - "生存"
    - "创造"
    - "冒险"
    - "旁观"
  # 命令
  commands:
    - "gamemode"
    - "gm"

# 传送点系统
warpSettings:
  # 开关
  enable: true
  # 命令
  commands:
    - "warp"
  # 传送点命令
  setwarpCommands:
    - "setwarp"
  # 删除传送点命令
  delwarpCommands:
    - "delwarp"
  # 黑名单世界
  blackWorld:
    - "pvp"

# 快速调节天气
fastChangeWeatherSettings:
  # 开关
  enable: true
  # 时间
  weather:
    # 自定义命名
    晴天:
      # 下雨
      storm: false
      # 打雷
      thunder: false
      # 命令
      commands:
        - "sun"

# 背包查看
invseeSettings:
  # 开关
  enable: true
  # 命令
  commands:
    - "inv"
    - "invsee"

# 屏蔽
ignoreSettings:
  # 开关
  enable: true
  # 禁止屏蔽列表
  # 绕过权限: mhdftools.bypass.ignore.blacklist
  blacklist:
    - "BaiShenYao_Dog"
  # 命令
  commands:
    - "ignore"

# 经济系统
economySettings:
  # 开关
  enable: true
  # 默认货币数量
  default: 1000.0
  # 货币名称
  name: "金币"
  # 个人所得税(获得金币时支付)
  personalIncomeTax:
    # 开关
    enable: true
    # 税率(单位: 百分比)
    rate: 0.05
  # 经济管理命令
  moneyadminCommands:
    - "moneyadmin"
    - "eco"
  # 查询余额命令
  moneyCommands:
    - "money"
  # 转账命令
  payCommands:
    - "pay"

