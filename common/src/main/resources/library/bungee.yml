# 本文件用于声明依赖项的版本配置
# 若无特殊需求，请勿修改此文件
# 随意修改可能导致插件功能异常

# 配置文件版本号(请勿修改)
config_version: "${project.version}"

# 更新插件自动覆盖配置
update: true

library:
  - repo: "https://repo.huaweicloud.com/repository/maven/"
    dependency: "${libs.adventure_api}"
  - repo: "https://repo.huaweicloud.com/repository/maven/"
    dependency: "net.kyori:adventure-key:4.25.0"
  - repo: "https://repo.huaweicloud.com/repository/maven/"
    dependency: "net.kyori:examination-api:4.25.0"
  - repo: "https://repo.huaweicloud.com/repository/maven/"
    dependency: "net.kyori:examination-string:4.25.0"
  - repo: "https://repo.huaweicloud.com/repository/maven/"
    dependency: "net.kyori:adventure-text-logger-slf4j:4.25.0"
  - repo: "https://repo.huaweicloud.com/repository/maven/"
    dependency: "${libs.adventure_text_minimessage}"
  - repo: "https://repo.huaweicloud.com/repository/maven/"
    dependency: "${libs.adventure_text_serializer_gson}"
  - repo: "https://repo.huaweicloud.com/repository/maven/"
    dependency: "${libs.adventure_text_serializer_legacy}"
  - repo: "https://repo.huaweicloud.com/repository/maven/"
    dependency: "${libs.adventure_text_serializer_plain}"
  - repo: "https://repo.huaweicloud.com/repository/maven/"
    dependency: "net.kyori:ansi:1.0.3"
  - repo: "https://repo.huaweicloud.com/repository/maven/"
    dependency: "net.kyori:option:1.1.0"
  - repo: "https://repo.huaweicloud.com/repository/maven/"
    dependency: "${libs.fastjson}"
    relocate:
      enable: true
  - repo: "https://repo.huaweicloud.com/repository/maven/"
    dependency: "${libs.reflections}"
    relocate:
      enable: true